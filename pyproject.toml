[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "codonslider"
dynamic = ["version"]
description = "Bioinformatic tool for codon stretch detection in CCDS sequences"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Boris Simeonov", email = "bsimeonovb@gmail.com" }]
requires-python = ">=3.9"
dependencies = ["biopython", "numpy", "pandas"]
keywords = ["bioinformatics", "codon", "CCDS", "sliding window", "translation", "tRNA"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Typing :: Typed",
]

[project.optional-dependencies]
test = ["pytest", "pytest-cov"]

[project.scripts]
codonslider = "codonslider.cli:main"

[project.urls]
Homepage = "https://github.com/simeonovb/codonslider"
Issues = "https://github.com/simeonovb/codonslider/issues"
Changelog = "https://github.com/simeonovb/codonslider/blob/master/CHANGELOG.md"

[tool.setuptools]
packages = ["codonslider"]

[tool.setuptools.package-data]
codonslider = ["py.typed"]

[tool.setuptools.dynamic]
version = { attr = "codonslider.version.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["codonslider"]

[tool.coverage.report]
show_missing = true
fail_under = 100

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
